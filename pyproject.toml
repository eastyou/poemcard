[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poemcard"
version = "0.1.0"
description = "古诗竖排卡片：逐字排版的 A4 展示卡与书写稿纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["poetry", "chinese", "printable", "classroom", "teacher", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
poemcard = "poemcard.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/poemcard"
Source = "https://github.com/eastyou/poemcard"

[tool.setuptools]
packages = ["poemcard"]
